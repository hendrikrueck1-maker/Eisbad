name: PWA veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Webseite zusammenstellen
        run: |
          mkdir site
          cp index.html app.js style.css sw.js manifest.webmanifest .nojekyll site/
          cp app/src/main/assets/phrases.json app/src/main/assets/voices.json site/
          cp -r icons site/
          if [ -d app/src/main/assets/voice ]; then cp -r app/src/main/assets/voice site/voice; else mkdir site/voice; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
